<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Something moving right, stopped dead at a line it cannot cross. That is
       the product in two shapes, and it stays legible at 16px, which reins
       themselves would not. -->
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <circle cx="11" cy="16" r="3.5" fill="#e4e4e7"/>
  <rect x="19" y="6" width="3.5" height="20" rx="1.75" fill="#dc2626"/>
</svg>
