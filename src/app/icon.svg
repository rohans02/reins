<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Lakshman Rekha, as a mark: something moving right, stopped at a line
       it cannot cross. Deliberately legible at 16px — two shapes, no detail. -->
